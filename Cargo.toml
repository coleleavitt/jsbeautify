[workspace]
resolver = "3"

[package]
name = "js-beautify-rs"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false
description = "A fast JavaScript beautifier and deobfuscator powered by oxc"
license = "MIT"
repository = "https://github.com/coleleavitt/js-beautify-rs"
keywords = ["javascript", "beautifier", "deobfuscator", "webpack", "oxc"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "research/",
    "instructions.md",
    "SESSION_SUMMARY.md",
    "PHASE6_PROGRESS.md",
    "QUICK_REFERENCE.md",
    "IMPROVEMENTS.md",
    "AST_ARCHITECTURE.md",
    "tests/",
    "examples/",
    ".idea/",
    ".ruff_cache/",
]

[[bin]]
name = "jsbeautify"
path = "src/bin/jsbeautify.rs"

# Single aggregator integration-test binary (cargo's own `tests/testsuite`
# pattern): one target that `mod`-includes every file under tests/integration/,
# instead of one separately-compiled crate per `tests/*.rs`.
[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.rustdoc]
private_intra_doc_links = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
needless_pass_by_ref_mut = "allow"
needless_lifetimes = "allow"
unused_self = "allow"
multiple_crate_versions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
float_cmp = "allow"
significant_drop_tightening = "allow"

[dependencies]
regex = "1"
thiserror = "2.0.18"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
rc4 = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = "0.244"
rustc-hash = "2"
# oxc pinned to the revision this crate currently targets. Plain
# `cargo install --path .` does not honor Cargo.lock unless `--locked` is
# supplied, so leaving these on `branch = "main"` makes installs break whenever
# upstream OXC changes its AST API.
# To use your fork instead: git = "https://github.com/coleleavitt/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314"
# To use the local checkout: replace each with `path = "/home/cole/RustProjects/forks/oxc/crates/<crate>"`
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_ast = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_ast_visit = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_syntax = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_traverse = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
oxc_diagnostics = { git = "https://github.com/oxc-project/oxc.git", rev = "ca7104f775bd372e834845c96218db57b0cb5314" }
clap = { version = "4.6.1", features = ["derive"] }
md5 = "0.7"
dhat = { version = "0.3", optional = true }

[features]
# Heap profiling with dhat. Build/run with `--features dhat-heap` to swap in
# dhat's allocator + profiler; produces `dhat-heap.json` (view at
# https://nnethercote.github.io/dh_view/dh_view.html) with per-call-site bytes.
dhat-heap = ["dep:dhat"]

[profile.dev]
debug = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"

[profile.miri]
inherits = "test"
opt-level = 1
overflow-checks = true

# Dedicated profiling profile — full debug symbols, same optimizations as release.
# Use: cargo build --profile profiling --features dhat-heap
# or:  cargo flamegraph --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
