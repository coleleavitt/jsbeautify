<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Why jsbeautify</title>
  <desc id="desc">A minified bundle from a web app or Bun binary is too large and unreadable to hand straight to an AI agent. jsbeautify turns it into readable, named, verified code first.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b8f8a"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="24" fill="#fdfdfb"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#1b1b1b">

    <!-- arrows -->
    <g stroke="#5b8f8a" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#head)">
      <line x1="232" y1="190" x2="362" y2="190"/>
      <line x1="550" y1="190" x2="700" y2="190"/>
      <line x1="470" y1="362" x2="552" y2="404"/>
      <line x1="696" y1="404" x2="778" y2="324"/>
    </g>

    <!-- red X over the direct path -->
    <g stroke="#7a1424" stroke-width="22" stroke-linecap="round">
      <line x1="597" y1="152" x2="653" y2="228"/>
      <line x1="653" y1="152" x2="597" y2="228"/>
    </g>
    <text x="625" y="268" font-size="17" fill="#7a1424">10 MB of a, b, c</text>

    <!-- web app / binary: a browser window -->
    <g stroke="#1b1b1b" stroke-width="8" fill="none" stroke-linejoin="round">
      <rect x="62" y="128" width="150" height="122" rx="14"/>
      <line x1="62" y1="160" x2="212" y2="160"/>
      <line x1="88" y1="192" x2="160" y2="192" stroke-linecap="round"/>
      <line x1="88" y1="216" x2="186" y2="216" stroke-linecap="round"/>
    </g>
    <g fill="#1b1b1b"><circle cx="82" cy="144" r="5"/><circle cx="98" cy="144" r="5"/><circle cx="114" cy="144" r="5"/></g>
    <text x="137" y="292" font-size="20" font-weight="600">web app · Bun binary</text>

    <!-- the bundle: a file with a JS band -->
    <path d="M395 102 h78 l40 40 v156 a10 10 0 0 1 -10 10 h-108 a10 10 0 0 1 -10 -10 v-186 a10 10 0 0 1 10 -10 z" fill="none" stroke="#1b1b1b" stroke-width="9" stroke-linejoin="round"/>
    <path d="M473 102 v40 h40" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="9" stroke-linejoin="round"/>
    <rect x="370" y="168" width="168" height="66" rx="10" fill="#1b1b1b"/>
    <text x="454" y="219" font-size="48" font-weight="800" fill="#fdfdfb">JS</text>
    <text x="454" y="340" font-size="20" font-weight="600">bundle.min.js</text>

    <!-- AI agent: a robot head -->
    <g stroke="#1b1b1b" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <rect x="738" y="132" width="150" height="118" rx="26"/>
      <line x1="813" y1="132" x2="813" y2="104"/>
      <line x1="726" y1="176" x2="726" y2="210"/>
      <line x1="900" y1="176" x2="900" y2="210"/>
      <line x1="788" y1="218" x2="838" y2="218"/>
    </g>
    <circle cx="813" cy="96" r="9" fill="#1b1b1b"/>
    <circle cx="785" cy="180" r="11" fill="#1b1b1b"/>
    <circle cx="841" cy="180" r="11" fill="#1b1b1b"/>
    <text x="813" y="292" font-size="20" font-weight="600">AI agent</text>

    <!-- jsbeautify -->
    <circle cx="625" cy="440" r="72" fill="#c2410c"/>
    <circle cx="625" cy="440" r="72" fill="none" stroke="#1b1b1b" stroke-width="8"/>
    <text x="625" y="461" font-size="58" font-weight="800" fill="#fdfdfb">{ }</text>
    <path d="M650 352 l6 14 l14 6 l-14 6 l-6 14 l-6 -14 l-14 -6 l14 -6 z" fill="#fdfdfb" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
    <text x="625" y="540" font-size="22" font-weight="700">jsbeautify</text>
    <text x="768" y="398" font-size="17" fill="#3d6b66" text-anchor="start">readable, named,</text>
    <text x="768" y="420" font-size="17" fill="#3d6b66" text-anchor="start">still runs the same</text>
  </g>
</svg>
